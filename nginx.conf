# Define Rate Limiting Zones (DDoS protection)
# 10MB of memory can store state for about 160,000 IP addresses
# Limit API to 10 requests per second per IP
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
# Limit overall site to 30 requests per second per IP
limit_req_zone $binary_remote_addr zone=global_limit:10m rate=30r/s;

# Dynamic Connection header mapping for WebSocket / HTTP/1.1 keepalive
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;

    # Hide nginx version from response headers
    server_tokens off;

    # Enforce max upload size at proxy layer (defense-in-depth)
    client_max_body_size 3m;

    # Apply global rate limit (allows bursts of up to 50 requests instantly)
    limit_req zone=global_limit burst=50 nodelay;

    # Defense-in-depth security headers at proxy level
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Block public access to internal Prometheus metrics
    location = /api/metrics {
        return 403;
    }

    # Route /api/ to the backend container
    location /api/ {
        # Stricter limit specifically for API requests (allows bursts of 20)
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://backend:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        
        # Pass real client IP to the backend (crucial for backend rate limiting)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_cache_bypass $http_upgrade;
    }

    # Route everything else to the frontend container
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_cache_bypass $http_upgrade;
    }
}
